<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>no-consent</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #0f1115;
      --fg: #e7e9ee;
      --muted: #8a909a;
      --accent: #4f8cff;
      --accent-hover: #6a9eff;
      --ok: #4ade80;
      --warn: #fbbf24;
      --err: #f87171;
      --border: #23262d;
      --btn-bg: #1c1f26;
    }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg);
      font: 13px/1.4 -apple-system, "SF Pro Text", system-ui, sans-serif; }
    body { width: 280px; padding: 14px 14px 12px; }

    .title { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 6px; }
    .host { font-size: 14px; font-weight: 600; word-break: break-all;
      padding: 0 0 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }

    .reject-btn {
      width: 100%; padding: 11px 12px; background: var(--accent); color: #fff;
      border: 0; border-radius: 8px; font-size: 13px; font-weight: 600;
      cursor: pointer; transition: background 120ms ease, transform 60ms ease;
    }
    .reject-btn:hover:not(:disabled) { background: var(--accent-hover); }
    .reject-btn:active:not(:disabled) { transform: scale(0.98); }
    .reject-btn:disabled { background: #2a2e36; color: var(--muted); cursor: not-allowed; }

    .status {
      margin-top: 10px; padding: 8px 10px; border-radius: 6px;
      background: var(--btn-bg); font-size: 12px; min-height: 16px;
      display: none; word-wrap: break-word;
    }
    .status.show { display: block; }
    .status.ok   { color: var(--ok);   border-left: 3px solid var(--ok); }
    .status.warn { color: var(--warn); border-left: 3px solid var(--warn); }
    .status.err  { color: var(--err);  border-left: 3px solid var(--err); }

    .divider { border-top: 1px solid var(--border); margin: 14px 0 10px; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .label { font-size: 12px; color: var(--muted); }
    .toggle { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; inset: 0; background: #2a2e36; border-radius: 999px;
      transition: background 120ms ease; cursor: pointer; }
    .slider::before { content: ""; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; background: #d0d3da; border-radius: 50%;
      transition: transform 120ms ease; }
    .toggle input:checked + .slider { background: var(--accent); }
    .toggle input:checked + .slider::before { transform: translateX(14px); background: #fff; }
  </style>
</head>
<body>
  <div class="title">no-consent</div>
  <div class="host" id="host">—</div>

  <button class="reject-btn" id="reject" type="button">Reject all consent</button>
  <div class="status" id="status"></div>

  <div class="divider"></div>
  <div class="row">
    <span class="label">Auto-run on this site</span>
    <label class="toggle">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </div>

  <script src="popup.js"></script>
</body>
</html>
